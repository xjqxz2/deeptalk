<text x="60" y="740" font-size="10.5" fill="#475467">· nvue 不支持 v-html：正文解析成块 + 行内 span，用 text 嵌套渲染，支持标题/列表/引用/代码/加粗/上标引用。</text>
<text x="60" y="758" font-size="10.5" fill="#475467">· 图标用 view 拼（汉堡/箭头/搜索/更多/圆点），不依赖字体，避免小程序端 emoji 变方块。</text>
<text x="60" y="776" font-size="10.5" fill="#475467">· Vant 只在 H5 生效（Toast/Dialog/Picker），小程序与 APP 退回 uni 原生组件；流式走 /api/v1/c/ws。</text>
