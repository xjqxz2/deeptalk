  <text x="632" y="432" font-size="9" fill="#667085">WebSocket 事件帧</text>
  <text x="632" y="452" font-size="8.5" fill="#475467">meta → reasoning → activity → delta</text>
  <text x="632" y="468" font-size="8.5" fill="#475467">→ sources → usage → done</text>
  <text x="632" y="488" font-size="8.5" fill="#98a2b3">与 Web 端 SSE 事件名一一对应</text>
</g>
