<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="noindex" />
    <title>网络未连接 · 小橘</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          'Noto Sans SC', sans-serif;
        background: #ffffff;
        color: #101828;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: calc(32px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
          calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        background: radial-gradient(circle at 50% 32%, #f2f5ff 0%, #ffffff 54%);
      }

      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }

      .mark {
        display: inline-block;
        width: 58px;
        height: 58px;
        margin-bottom: 22px;
        border-radius: 17px;
        box-shadow: 0 12px 28px rgba(77, 107, 254, 0.16);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.4;
        font-weight: 730;
        letter-spacing: -0.4px;
      }

      p {
        margin: 10px 0 0;
        color: #667085;
        font-size: 13px;
        line-height: 21px;
      }

      button {
        min-width: 132px;
        height: 40px;
        margin-top: 26px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #4d6bfe;
        color: #ffffff;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      button:active {
        background: #3b5bdb;
      }

      .hint {
        margin-top: 16px;
        color: #98a2b3;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="" width="58" height="58" />
      <h1>网络连接已断开</h1>
      <p>请检查 Wi-Fi 或移动网络，恢复连接后即可继续对话。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
      <p class="hint">已恢复网络时会自动刷新</p>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.reload()
      })
    </script>
  </body>
</html>
