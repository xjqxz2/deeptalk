<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="小橘树洞：克制、专注的个人 AI 对话工作台。" />
    <meta name="application-name" content="小橘树洞" />
    <meta name="format-detection" content="telephone=no" />
    <!-- iOS Safari 添加到主屏幕后以独立窗口运行 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小橘树洞" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/favicon-192.png" />
    <title>小橘树洞 · AI 对话工作台</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // PWA 固定视口：禁用 iOS 双指缩放与双击放大（iOS 会忽略 user-scalable）
      (function disableZoom() {
        var stop = function (event) { event.preventDefault() }
        document.addEventListener('gesturestart', stop, { passive: false })
        document.addEventListener('gesturechange', stop, { passive: false })
        document.addEventListener('gestureend', stop, { passive: false })
        var lastTouch = 0
        document.addEventListener('touchend', function (event) {
          var now = Date.now()
          if (now - lastTouch < 300) event.preventDefault()
          lastTouch = now
        }, { passive: false })
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
