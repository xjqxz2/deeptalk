upstream deeptalk_backend {
    server 127.0.0.1:9821;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name deeptalk.peon.top;

    ssl_certificate /root/.acme.sh/peon.top_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/peon.top_ecc/peon.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;
    access_log /var/log/nginx/deeptalk.access.log;
    error_log  /var/log/nginx/deeptalk.error.log;

    location / {
        proxy_pass http://deeptalk_backend;
        proxy_http_version 1.1;

        # SSE：关闭缓冲，避免 token 被 Nginx 攒到最后才下发
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name deeptalk.peon.top;

    location /.well-known/acme-challenge/ {
        root /var/www/deeptalk;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
